name: Deploy

on:
  push:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: app/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    needs:
      - test

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          test -n "$AWS_REGION" || (echo "AWS_REGION is not configured" && exit 1)
          test -n "$ECR_REPOSITORY" || (echo "ECR_REPOSITORY is not configured" && exit 1)
          test -n "$ECS_CLUSTER" || (echo "ECS_CLUSTER is not configured" && exit 1)
          test -n "$ECS_SERVICE" || (echo "ECS_SERVICE is not configured" && exit 1)
          test -n "$ECS_TASK_FAMILY" || (echo "ECS_TASK_FAMILY is not configured" && exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/arm64 \
            --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Check ECR image scan
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for attempt in {1..30}; do
            status=$(aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanStatus.status' \
              --output text 2>/dev/null || true)

            if [ "$status" = "COMPLETE" ]; then
              break
            fi

            if [ "$status" = "FAILED" ]; then
              echo "ECR image vulnerability scan failed"
              exit 1
            fi

            sleep 10
          done

          if [ "$status" != "COMPLETE" ]; then
            echo "ECR image vulnerability scan did not complete in time"
            exit 1
          fi

          findings=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --query 'findingSeverityCounts' \
            --output json)
          critical=$(echo "$findings" | jq -r '.CRITICAL // 0')
          high=$(echo "$findings" | jq -r '.HIGH // 0')

          echo "ECR findings: CRITICAL=$critical HIGH=$high"
          if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
            echo "Blocking deployment because HIGH or CRITICAL vulnerabilities were found"
            exit 1
          fi

      - name: Get current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Render new task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true