name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: app/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ARM64 image
        run: |
          docker build \
            --platform linux/arm64 \
            --tag aws-platform-app:test \
            .

      - name: Inspect image
        run: |
          docker image inspect aws-platform-app:test \
            --format '{{.Architecture}}/{{.Os}}'